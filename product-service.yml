server:
  port: 8083

spring:
  application:
    name: product-service

resilience4j:
  circuitbreaker:
    instances:
      productCB:
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
  timelimiter:
    instances:
      productCB:
        timeoutDuration: 2s
catalog-service:
  url: http://localhost:8081/catalog
inventory-service:
  url: http://localhost:8082/inventory
